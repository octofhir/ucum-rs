[package]
name = "octofhir-ucum"
version = "0.6.0"
edition = "2024"
authors = ["OctoFHIR Team <funyloony@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/octofhir/ucum-rs"
keywords = ["fhir", "ucum", "units", "measurement", "healthcare"]
categories = ["science", "data-structures", "parsing"]
description = "UCUM (Unified Code for Units of Measure) library for FHIRPath quantity operations with CLI, WASM, and FHIR integration"
documentation = "https://docs.rs/octofhir-ucum"
homepage = "https://github.com/octofhir/ucum-rs"
include = [
    "ucum-essence.xml",
    "src",
    "examples",
    "benches",
    "README.md",
    "build.rs",
]

[workspace]
members = [".", "wasm"]

[lib]
name = "octofhir_ucum"

[[bin]]
name = "octofhir-ucum"
path = "src/bin/cli.rs"
required-features = ["cli"]

[features]
default = ["std"]
# `std` enables regex/fuzzy unit search and uses the platform float math.
# Without it the crate is `no_std` + `alloc` and float math goes through `libm`.
std = ["dep:regex", "dep:fuzzy-matcher", "rust_decimal/std", "phf/std", "serde?/std"]
serde = ["dep:serde"]
cli = ["std", "dep:clap", "dep:anyhow", "dep:human-panic"]
fhir = ["std", "serde", "dep:thiserror"]

[dependencies]
# Core dependencies (all `no_std` + `alloc` compatible)
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }
rust_decimal = { version = "1.36", default-features = false }
phf = { version = "0.14", default-features = false, features = ["macros"] }
smallvec = "1.13"
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
foldhash = { version = "0.2", default-features = false }
spin = { version = "0.12", default-features = false, features = ["lazy"] }
libm = "0.2"

# std-only dependencies
regex = { version = "1.9", optional = true }
fuzzy-matcher = { version = "0.3", optional = true }
thiserror = { version = "2", optional = true }

# CLI dependencies
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }
human-panic = { version = "2.0.3", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
quick-xml = "0.41"
serde_json = "1"

[build-dependencies]
quick-xml = "0.41"
serde = "1"
serde_derive = "1"

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
