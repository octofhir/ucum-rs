name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          override: true
      
      - name: Build (default features)
        run: cargo build --verbose
      
      - name: Build (all features)
        run: cargo build --all-features --verbose
      
      - name: Build (CLI only)
        run: cargo build --features cli --verbose
      
      - name: Build (WASM bindings crate)
        run: cargo build -p octofhir-ucum-wasm --verbose
      
      - name: Build (FHIR only)
        run: cargo build --features fhir --verbose
      
      - name: Test (all features)
        run: cargo test --all-features --verbose
      
      - name: Test (no default features)
        run: cargo test --no-default-features --verbose
      
      - name: Test platform math without search
        run: cargo test --locked -p octofhir-ucum --no-default-features --features platform-math,serde

      - name: Compare platform and default math bit for bit
        shell: bash
        run: |
          manifest=tests/platform-consumer/Cargo.toml
          cargo run --quiet --manifest-path "$manifest" --features standard > standard-math.txt
          cargo run --quiet --manifest-path "$manifest" --features platform > platform-math.txt
          diff -u standard-math.txt platform-math.txt
          cargo tree --manifest-path "$manifest" --features platform --edges normal,build --prefix none > platform-deps.txt
          if grep -E '^(regex|fuzzy-matcher|clap|human-panic) v' platform-deps.txt; then
            echo "Search or CLI dependencies leaked into platform math"
            exit 1
          fi

      - name: Lint (clippy, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      
      - name: Lint (clippy, no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      
      - name: Format (rustfmt)
        run: cargo fmt --all -- --check
      
      - name: Build docs
        run: cargo doc --no-deps --all-features
      
      - name: Run benchmarks (smoke test)
        run: cargo bench --no-run

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
          override: true
      
      - name: Build (no_std, bare-metal target)
        run: cargo build --no-default-features --target thumbv7em-none-eabihf --verbose
      
      - name: Lint (clippy, bare-metal target)
        run: cargo clippy --no-default-features --target thumbv7em-none-eabihf -- -D warnings

      - name: Build (no_std with serde, bare-metal target)
        run: cargo build --no-default-features --features serde --target thumbv7em-none-eabihf --verbose

  wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      
      - name: Build WASM
        run: wasm-pack build wasm --target web --out-dir ../pkg --out-name octofhir_ucum
      
      - name: Test WASM build
        run: |
          # Verify the build artifacts exist
          ls -la pkg/
          test -f pkg/package.json
          test -f pkg/octofhir_ucum_bg.wasm
          test -f pkg/octofhir_ucum.js